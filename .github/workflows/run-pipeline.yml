# Triggers the fmcg_pipeline Databricks job (job-id 330888453390117)
# whenever code is pushed to main (or manually via workflow_dispatch).
# Requires repository secrets:
#   DATABRICKS_HOST  - your workspace URL, e.g. https://adb-1234567890.12.azuredatabricks.net
#   DATABRICKS_TOKEN - a Databricks access token (service principal recommended)
name: Run FMCG Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Sanity-check Databricks configuration
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os
          h = os.environ.get("DATABRICKS_HOST", "")
          t = os.environ.get("DATABRICKS_TOKEN", "")
          print("host set:", bool(h), "| length:", len(h), "| starts with https://", h.startswith("https://"))
          print("token set:", bool(t), "| length:", len(t), "| starts with dapi:", t.startswith("dapi"))
          EOF

      - name: Trigger Databricks pipeline job
        run: databricks jobs run-now 330888453390117 --no-wait --debug
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}