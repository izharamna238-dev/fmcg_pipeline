# Triggers the fmcg_pipeline Databricks job (job-id 330888453390117)
# whenever code is pushed to main (or manually via workflow_dispatch).
# Requires repository secrets:
#   DATABRICKS_HOST  - your workspace URL, e.g. https://adb-1234567890.12.azuredatabricks.net
#   DATABRICKS_TOKEN - a Databricks access token (service principal recommended)
name: Run FMCG Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Normalize Databricks host URL
        env:
          RAW_HOST: ${{ secrets.DATABRICKS_HOST }}
        run: |
          H="$(echo "$RAW_HOST" | tr -d '[:space:]')"
          case "$H" in
            https://*) ;;
            *) H="https://$H" ;;
          esac
          echo "DATABRICKS_HOST=$H" >> "$GITHUB_ENV"

      - name: Verify Databricks configuration
        run: |
          test -n "$DATABRICKS_HOST" || (echo "DATABRICKS_HOST secret is empty"; exit 1)
          test -n "${{ secrets.DATABRICKS_TOKEN }}" || (echo "DATABRICKS_TOKEN secret is empty"; exit 1)

      - name: Trigger Databricks pipeline job
        run: databricks jobs run-now 330888453390117 --no-wait
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}