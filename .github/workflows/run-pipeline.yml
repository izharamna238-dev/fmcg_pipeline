# Triggers the fmcg_pipeline Databricks job (job-id 330888453390117)
# whenever code is pushed to main (or manually via workflow_dispatch).
# Requires repository secrets:
#   DATABRICKS_HOST  - your workspace URL, e.g. https://adb-1234567890.12.azuredatabricks.net
#   DATABRICKS_TOKEN - a Databricks access token (service principal recommended)
name: Run FMCG Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Probe A - host starts with https://
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        run: python3 -c "import os,sys; sys.exit(0 if os.environ['DATABRICKS_HOST'].startswith('https://') else 1)"

      - name: Probe B - host looks like a Databricks workspace URL
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        run: python3 -c "import os,sys; h=os.environ['DATABRICKS_HOST']; sys.exit(0 if (h.endswith('.azuredatabricks.net') or h.endswith('.databricks.com') or h.endswith('.gcp.databricks.com')) else 1)"

      - name: Probe C - token has dapi prefix
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python3 -c "import os,sys; t=os.environ['DATABRICKS_TOKEN']; sys.exit(0 if t.startswith('dapi') else 1)"

      - name: Trigger Databricks pipeline job
        run: databricks jobs run-now 330888453390117 --no-wait --debug
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}